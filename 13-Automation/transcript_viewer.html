<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skight Agent Platform - Hierarchical Trace & Call Stack Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-amber: #fbbf24;
            --accent-purple: #c084fc;
            --accent-pink: #f472b6;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.75rem;
            color: var(--accent-blue);
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .drop-zone:hover {
            border-color: var(--accent-blue);
            background: #1e293b80;
        }

        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease;
        }

        .event-card.is-child {
            margin-left: 36px;
            border-left: 4px solid var(--accent-purple);
        }

        .event-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-TurnStart { background: #0284c720; color: var(--accent-blue); border: 1px solid #0284c7; }
        .badge-LlmCall { background: #9333ea20; color: var(--accent-purple); border: 1px solid #9333ea; }
        .badge-ToolExecution { background: #d9770620; color: var(--accent-amber); border: 1px solid #d97706; }
        .badge-TurnEnd { background: #16a34a20; color: var(--accent-green); border: 1px solid #16a34a; }
        .badge-Span { background: #47556940; color: var(--text-muted); font-family: monospace; font-size: 0.7rem; }

        .timestamp {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tree-line {
            color: var(--accent-purple);
            font-family: monospace;
            font-weight: bold;
            margin-right: 6px;
        }

        .payload {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
        }

        details summary {
            cursor: pointer;
            color: var(--accent-blue);
            font-weight: 600;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .raw-payload {
            background: #020617;
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: #cbd5e1;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌲 Agent Call Stack & Trace Tree Viewer</h1>
            <p style="color: var(--text-muted); margin: 0;">Inspect <code>transcript.jsonl</code> (compact) or <code>transcript_full.jsonl</code> (full detail with un-truncated prompts & tool arguments).</p>
        </header>

        <div class="drop-zone" id="dropZone">
            <p>📂 Drag & Drop <code>transcript.jsonl</code> or <code>transcript_full.jsonl</code> here, or click to browse</p>
            <input type="file" id="fileInput" accept=".jsonl,.txt" style="display: none;">
        </div>

        <div id="eventsContainer"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const eventsContainer = document.getElementById('eventsContainer');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent-blue)'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border-color)'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => renderTranscript(e.target.result);
            reader.readAsText(file);
        }

        function renderTranscript(content) {
            eventsContainer.innerHTML = '';
            const lines = content.split('\n').filter(l => l.trim());
            
            lines.forEach((line, index) => {
                try {
                    const evt = JSON.parse(line);
                    const card = document.createElement('div');
                    
                    const isChild = !!evt.ParentSpanId;
                    card.className = `event-card ${isChild ? 'is-child' : ''}`;

                    const eventType = evt.EventType || 'Event';
                    const name = evt.Name || 'Step';
                    const timestamp = evt.Timestamp ? new Date(evt.Timestamp).toLocaleTimeString() : '';
                    const duration = evt.DurationMs ? ` (${evt.DurationMs} ms)` : '';
                    const payload = evt.Payload || '';
                    const rawPayload = evt.RawPayload || (evt.Attributes ? JSON.stringify(evt.Attributes, null, 2) : '');
                    const spanId = evt.SpanId ? `Span: ${evt.SpanId.substring(0, 8)}` : '';
                    const parentSpanId = evt.ParentSpanId ? `Parent: ${evt.ParentSpanId.substring(0, 8)}` : '';

                    card.innerHTML = `
                        <div class="event-header">
                            <div>
                                ${isChild ? '<span class="tree-line">└──</span>' : ''}
                                <span class="badge badge-${eventType}">${eventType}</span>
                                <strong style="margin-left: 8px;">${name}${duration}</strong>
                            </div>
                            <div>
                                ${parentSpanId ? `<span class="badge badge-Span">${parentSpanId}</span> ` : ''}
                                ${spanId ? `<span class="badge badge-Span">${spanId}</span> ` : ''}
                                <span class="timestamp">${timestamp}</span>
                            </div>
                        </div>
                        <div class="payload">${escapeHtml(payload)}</div>
                        ${rawPayload ? `
                            <details>
                                <summary>🔍 View Full Raw Payload / Attributes</summary>
                                <div class="raw-payload">${escapeHtml(rawPayload)}</div>
                            </details>
                        ` : ''}
                    `;
                    eventsContainer.appendChild(card);
                } catch (err) { }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
